<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with Tableau Data</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "Segoe UI", sans-serif; background: #0f1419; color: #e6e6e6;
         display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px; background: #16202a; border-bottom: 1px solid #223;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; font-weight: 600; }
  header button { background: none; border: 1px solid #445; color: #9ab; border-radius: 6px;
                  padding: 6px 12px; cursor: pointer; font-size: 13px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.55;
         white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
  .user { align-self: flex-end; background: #1d4ed8; color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #1c2733; border-bottom-left-radius: 4px; }
  .bot.thinking { color: #789; font-style: italic; }
  form { display: flex; gap: 10px; padding: 14px 20px; background: #16202a; border-top: 1px solid #223; }
  input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #334;
          background: #0f1419; color: #e6e6e6; font-size: 14px; outline: none; }
  input:focus { border-color: #1d4ed8; }
  form button { padding: 12px 20px; border: none; border-radius: 8px; background: #1d4ed8;
                color: #fff; cursor: pointer; font-size: 14px; }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>📊 Chat with Tableau Data</h1>
  <button id="reset">ล้างบทสนทนา</button>
</header>
<div id="chat">
  <div class="msg bot">สวัสดีครับ ถามข้อมูลจาก Tableau ได้เลย เช่น "มี data source อะไรบ้าง"</div>
</div>
<form id="form">
  <input id="input" placeholder="พิมพ์คำถามเกี่ยวกับข้อมูลของคุณ..." autocomplete="off">
  <button id="send" type="submit">ส่ง</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

function add(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  add(message, "user");
  input.value = "";
  send.disabled = true;
  const thinking = add("กำลังค้นข้อมูล...", "bot thinking");
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    const data = await r.json();
    thinking.remove();
    add(data.answer ?? ("เกิดข้อผิดพลาด: " + (data.error || "unknown")), "bot");
  } catch (err) {
    thinking.remove();
    add("เชื่อมต่อ server ไม่ได้: " + err.message, "bot");
  } finally {
    send.disabled = false;
    input.focus();
  }
});

document.getElementById("reset").addEventListener("click", async () => {
  await fetch("/api/reset", { method: "POST" });
  chat.innerHTML = "";
  add("เริ่มบทสนทนาใหม่แล้วครับ", "bot");
});
</script>
</body>
</html>
